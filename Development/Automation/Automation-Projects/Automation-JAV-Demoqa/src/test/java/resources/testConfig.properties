# Synchronization defaults. These can be overridden in the test case.
defaultTimeout=10
defaultInterval=1

# Parallel Execution - true or false. (Note: Passing parameter in command line will override this setting. Example: mvn verify -DparallelExecution=true)
parallelExecution=false
parallelExecutionThreads=4
