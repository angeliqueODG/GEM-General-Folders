version=1.16

############### Client, Project, Application Configuration ###############
# Client Reference ID - Based on cid +  UUID
clientRefID=
# Project Reference ID - Based on pid +  UUID
projectRefID=
# Application Reference ID - Based on aid +  UUID
applicationRefID=

######################### Execution configuration #########################
# Parallel Execution - parallelExecution: true or false. (Note: Passing parameter in command line will override this setting. Example: mvn verify -DparallelExecution=true)
parallelExecution=false
# Number of threads to run in parallel - parallelExecutionThreads: 4
parallelExecutionThreads=4

######################### User Satisfaction Assessment Configuration #########################
# User satisfaction assessment - userSatisfactionAssessment: true or false
userSatisfactionAssessment=true

######################### Screen capture configuration #########################
# Take screenshot when test step results selections matches - screenCaptureOnTestStepResults: true or false
screenCaptureOnTestStepResults=true

# Take screenshot of test step results selections (Comma delimited)
# screenCaptureOnTestStepResultsSelection: Fail, WarnCritical, WarnHigh, WarnMedium, WarnLow, Pass
screenCaptureOnTestStepResultsSelection=Fail, WarnCritical, WarnHigh, WarnMedium, WarnLow

# Screen capture directory from the project root - screenCaptureOutputPath: target/screenshots/
screenCaptureOutputPath=target/screenshots/
# Screen capture archive directory from the project root - screenCaptureArchivePath: target/screenshots-archive/
screenCaptureArchivePath=target/screenshots-archive/

######################### Browser configuration #########################
# Which browser to utilize - browser: chrome, firefox, safari
browser=chrome
# Headless mode - headless: true or false
headless=false
# Suppress Chrome's "Change your password" data-breach leak detection dialog
browserSuppressLeakDetection=true
# Suppress Chrome's "Save password?" / "Update password?" prompts
browserSuppressPasswordManager=true
# Suppress Chrome's "Save address?" / "Save card?" autofill prompts
browserSuppressAutofillPrompts=true
# Hide the yellow "Chrome is being controlled by automated test software" infobar
browserSuppressAutomationInfobar=true
# Accept expired / self-signed SSL certificates without an interstitial warning
browserAcceptInsecureCerts=true
# Note: Browser extension support remains in FW_Browser.java. To add a Chrome
# extension, see the "Browser Extensions Requirements" section in FW_Browser.java.

######################### Image configuration #########################
# Trim the image - imageTrim: true or false
imageTrim=true
# Image trim background threshold - imageTrimBackgroundThreshold: 30 = 30% variation of background color based on edge analysis
imageTrimBackgroundThreshold=30
# Image conversion from PNG to JPG - imageConvertToJPG: true or false (can be used to reduce file size)
imageConversionToJPG=true
# Image compression quality - imageCompressionJPGQuality: 10 = 10% original quality (only applies if imageConvertToJPG=true)
imageCompressionJPGQuality=10
# Image thumbnail maximum size - imageThumbnailMaxSize: 200 = No larger than 200x200 pixels
imageThumbnailMaxSize=200
# Image thumbnail jpg compression quality - imageThumbnailJPGQuality: 50% = 50% original quality (only applies if imageConvertToJPG=true)
imageThumbnailCompressionJPGQuality=50

############### Data Configuration ###############
# Path for storing test data - dataOutputPath: target/test-data
dataOutputPath=target/test-data
# Path for archiving test data after it's been processed - dataArchivePath: target/test-data-archive
dataArchivePath=target/test-data-archive
# Filename for test step data - dataFilename: test-steps.csv
dataTestStepsFilename=test-steps.csv

############### Report Configuration ###############
# Path for storing audit reports - reportOutputPath: target/reports
reportOutputPath=target/reports
# Path for archiving audit reports - reportArchivePath: target/reports-archive  
reportArchivePath=target/reports-archive

# ---------- Report Output Configuration ----------
# Generate Markdown format - reportOutputMarkdown: true or false
reportOutputMarkdown=true
# Generate HTML format - reportOutputHtml: true or false
reportOutputHtml=false

# ---------- Report Help Links ----------
# Enable help links in HTML reports - reportHelpLinksEnabled: true or false
reportHelpLinksEnabled=true
# Help link provider - reportHelpLinksProvider: perplexity
reportHelpLinksProvider=perplexity

# ---------- Report Advisor ----------
# Enable mAi Advisor™ intelligent guidance - reportAdvisorEnabled: true or false
reportAdvisorEnabled=true

################# GeoIP Configuration ###############
# GeoLite2-ASN database file - src/test/java/framework/data/GeoLite2-ASN.mmdb
geoLite2ASNDatabase=src/test/java/framework/data/GeoLite2-ASN.mmdb
# GeoLite2-City database file - src/test/java/framework/data/GeoLite2-City.mmdb
geoLite2CityDatabase=src/test/java/framework/data/GeoLite2-City.mmdb

############### Google Cloud Configuration ###############
# Google Cloud Project ID - my-project-id
googleCloudProjectId=
# Google Cloud Service Account JSON file - src/test/resources/my-project-id-123456-abcdef.json
googleCloudServiceAccountJsonFile=src/test/resources/.private/

# ---------- Google Cloud - Storage ----------
# Enable exporting assets such as images to Google Cloud Storage - true or false
googleCloudStorageExport=false
# Google Cloud Storage base URL - https://storage.googleapis.com/
googleCloudStorageBaseURL=https://storage.googleapis.com/
# Google Cloud Storage bucket name - my_bucket
googleCloudStorageBucket=missionwares_images

# ---------- Google Cloud - BigQuery ----------
# Enable exporting test step results to Google Cloud BigQuery - true or false
googleCloudBigQueryExport=false
# Google Cloud BigQuery timeout - defaultTimeout: 10 seconds
googleCloudBigQueryTimeout=10
# Google Cloud BigQuery maximum number of load data attempts
googleCloudBigQueryMaxAttempts=10

# Google Cloud Project Dataset - my_dataset
googleCloudProjectDataset=dataset_automation_01

# Google Cloud Project Table - Client
googleCloudProjectDatasetTableClients=table_clients_01
# Google Cloud Project Table - Client Schema
googleCloudProjectDatasetTableClientsSchema=src/test/java/framework/data/FW_GoogleCloudBigQueryTableClientsSchema.json

# Google Cloud Project Table - Project
googleCloudProjectDatasetTableProjects=table_projects_01
# Google Cloud Project Table - Project Schema
googleCloudProjectDatasetTableProjectsSchema=src/test/java/framework/data/FW_GoogleCloudBigQueryTableProjectsSchema.json

# Google Cloud Project Table - Application
googleCloudProjectDatasetTableApplications=table_applications_01
# Google Cloud Project Table - Application Schema
googleCloudProjectDatasetTableApplicationsSchema=src/test/java/framework/data/FW_GoogleCloudBigQueryTableApplicationsSchema.json

# Google Cloud Project Table - Test Steps
googleCloudProjectDatasetTableTestSteps=table_teststeps_01
# Google Cloud Project Table - Test Steps Schema
googleCloudProjectDatasetTableTestStepsSchema=src/test/java/framework/data/FW_GoogleCloudBigQueryTableTestStepsSchema.json

############### Google Sheet Configuration ###############
# Enable synchronization of Google Sheet Clients, Projects, and Applications to Google BigQuery - true or false
googleSheetSyncToBigQuery=false
# Google Sheet Name - Automation Administration - Reporting
googleSheetName=Automation Administration - Reporting
# Google Sheet ID - (You ca find this in the URL of the Google Sheet between /d/ and /edit)
googleSheetId=
# Google Sheet Tab Name for Client - table_clients_01
googleSheetTabNameClients=table_clients_01
# Google Sheet Tab Name for Project - table_projects_01
googleSheetTabNameProjects=table_projects_01
# Google Sheet Tab Name for Application - table_applications_01
googleSheetTabNameApplications=table_applications_01

######################### Locator Configuration #########################
# Locator timeout - defaultTimeout: 10 seconds
defaultTimeout=20
# Locator retry interval - defaultInterval: 1 second
defaultInterval=1

# ---------- Locator Highlighting Configuration ----------
# Highlight the locator - locatorHighlight: true or false
locatorHighlight=true
# Hightlight when loading URL's - locatorHighlightOnLoad: true or false. May result in larger screenshots
locatorHighlightOnLoad=false

# ---------- Locator CSS Configuration ----------
# CSS for locator highlighting - General
locatorHighlightCSS=arguments[0].style.border='3px solid pink'
# CSS for locator highlighting - Pass
locatorHighlightPassCSS=arguments[0].style.border='3px solid green'
# CSS for locator highlighting - Warn Low
locatorHighlightWarnLowCSS=arguments[0].style.border='3px solid greenyellow'
# CSS for locator highlighting - Warn Medium
locatorHighlightWarnMediumCSS=arguments[0].style.border='3px solid yellow'
# CSS for locator highlighting - Warn High
locatorHighlightWarnHighCSS=arguments[0].style.border='3px solid orange'
# CSS for locator highlighting - Warn Critical
locatorHighlightWarnCriticalCSS=arguments[0].style.border='3px solid coral'
# CSS for locator highlighting - Fail
locatorHighlightFailCSS=arguments[0].style.border='3px solid red'

######################### Framework Configuration #########################
# Detailed debug/verbose logging for troubleshooting - true or false
debug=true